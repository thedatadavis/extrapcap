[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "extrapcap"
version = "0.1.0"
description = "Reproducible research and paper-trading system for Extrapolation Capital"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pandas>=2.2", "numpy>=1.26", "httpx>=0.27", "python-dateutil>=2.9.0", "fastapi>=0.115"]

[project.optional-dependencies]
dev = ["modal>=1.0,<2", "pyarrow>=17.0", "pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
