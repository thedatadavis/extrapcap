name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      purge_legacy_d1_bars:
        description: "Delete obsolete analytical market-bar rows from D1"
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    name: Test & Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run Pytest
        run: |
          pytest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node dependencies
        run: pnpm install

      - name: Build Astro SSR App
        run: pnpm build

      - name: Deploy Modal Serverless Crons
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "::error::MODAL_TOKEN_ID is not configured"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "::error::MODAL_TOKEN_SECRET is not configured"; exit 1; }
          pip install modal
          modal deploy modal_app/app.py

      - name: Deploy Cloudflare Pages & D1 Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          pnpm wrangler d1 execute extrapcap --remote --file=schema.sql
          pnpm wrangler pages deploy dist --project-name=extrapcap

      - name: Purge legacy market bars from D1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purge_legacy_d1_bars == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm wrangler d1 execute extrapcap --remote --command "SELECT COUNT(*) AS legacy_bar_rows FROM bars"
          pnpm wrangler d1 execute extrapcap --remote --command "DELETE FROM bars"
          pnpm wrangler d1 execute extrapcap --remote --command "SELECT COUNT(*) AS legacy_bar_rows_remaining FROM bars"
