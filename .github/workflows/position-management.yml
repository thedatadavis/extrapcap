name: Manage paper positions
on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes during market hours (9:30 AM to 4:30 PM EDT / 13:30 to 20:30 UTC).
    - cron: '*/30 13-20 * * 1-5'
concurrency:
  group: extrapcap-ops-writer
  cancel-in-progress: false
jobs:
  manage:
    runs-on: ubuntu-latest
    environment: paper
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops
          fetch-depth: 0
      - name: Sync source branch
        run: .github/scripts/sync-ops.sh
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install -e .
      - name: Evaluate and manage held verticals
        env:
          ALPACA_PAPER: 'true'
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: >-
          python -m extrapcap.execution.position_manager
          --as-of "$(date -u +%F)"
      - name: Commit management ledger
        run: |
          git config user.name extrapcap-bot
          git config user.email extrapcap-bot@users.noreply.github.com
          git add -A logs
          git diff --cached --quiet || git commit -m "ledger: manage paper positions $(date -u +%F)"
          .github/scripts/push-ops.sh
