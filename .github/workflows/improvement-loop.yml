name: GLM 5.2 Policy Improvement Loop
on:
  workflow_dispatch:
  schedule:
    - cron: '15 22 * * 1-5'
concurrency:
  group: extrapcap-ops-writer
  cancel-in-progress: false
jobs:
  policy-learning:
    runs-on: ubuntu-latest
    environment: paper
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops
          fetch-depth: 0
      - name: Sync source branch
        run: .github/scripts/sync-ops.sh
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install -e .
      - name: Run GLM 5.2 policy learner
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          NEBIUS_MODEL: ${{ vars.NEBIUS_MODEL || 'glm-5.2' }}
        run: python -m extrapcap.improvement_cli --date "$(date -u +%F)" --output-dir logs/proposals
      - name: Commit policy proposals
        run: |
          git config user.name extrapcap-bot
          git config user.email extrapcap-bot@users.noreply.github.com
          mkdir -p logs/proposals
          git add logs/proposals/*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "policy: GLM 5.2 proposals $(date -u +%F)"
          .github/scripts/push-ops.sh
